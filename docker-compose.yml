# Local infra:        docker compose up -d
# Full stack + nginx: docker compose --profile full up -d --build --scale api=3
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      retries: 10

  redis: # durable application state: refresh tokens and rate-limit counters
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  redis-cache: # disposable cache: eviction here cannot affect queues or auth state
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  redis-queue: # BullMQ requires durable, non-evicting storage
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [queue-redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  redis-socket: # Socket.IO adapter pub/sub and distributed socket throttling
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio: # S3-compatible storage for local development
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/app-uploads-local &&
      mc anonymous set none local/app-uploads-local"

  api: &app
    profiles: ['full']
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis-cache:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      SOCKET_REDIS_URL: redis://redis-socket:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
      redis-socket: { condition: service_healthy }
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ['node', 'src/worker.js']
    stop_grace_period: 60s

  nginx:
    profiles: ['full']
    image: nginx:1.27-alpine
    volumes: ['./nginx/nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['8080:80']
    depends_on: [api]

volumes: { pgdata: {}, redisdata: {}, queue-redisdata: {}, miniodata: {} }
