name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: app
  ECS_CLUSTER: app-prod
  API_SERVICE: app-api
  WORKER_SERVICE: app-worker

jobs:
  docker-build-check:
    name: Verify Dockerfile build on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image (dry-run without push)
        run: docker build -t app:pr-check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Security audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm run lint
      - run: npm run build
      - name: Configure non-superuser test fixture role
        run: |
          psql "postgresql://postgres:postgrespassword@localhost:5432/app_test" -c "
            CREATE ROLE tenant_app_role NOLOGIN NOSUPERUSER NOBYPASSRLS;
            CREATE ROLE app_platform_role NOLOGIN NOSUPERUSER NOBYPASSRLS;
            CREATE ROLE app_ci_fixture WITH LOGIN PASSWORD 'app_ci_fixture_password' INHERIT NOSUPERUSER NOBYPASSRLS;
            -- Fixture setup spans tenants. RLS tests explicitly switch into the tenant role.
            GRANT app_platform_role TO app_ci_fixture;
            GRANT tenant_app_role TO app_ci_fixture WITH INHERIT FALSE, SET TRUE;
            GRANT CONNECT ON DATABASE app_test TO app_ci_fixture;
            GRANT USAGE, CREATE ON SCHEMA public TO app_ci_fixture;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO app_ci_fixture;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO app_ci_fixture;
          "
        env:
          PGPASSWORD: postgrespassword
      - run: npm test
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgrespassword@localhost:5432/app_test
          DB_PROVISIONER_URL: postgresql://postgres:postgrespassword@localhost:5432/app_test
          DATABASE_URL: postgresql://app_ci_fixture:app_ci_fixture_password@localhost:5432/app_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_pipeline_32chars!
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_pipeline_32chars!
          JWT_PLATFORM_SECRET: test_jwt_platform_secret_for_ci_pipeline_32chars!
          JWT_SUPPORT_SECRET: test_jwt_support_secret_for_ci_pipeline_32chars!
          ENCRYPTION_KEY: test_encryption_key_for_ci_pipeline_32chars!
          BFF_SHARED_SECRET: test_bff_shared_secret_for_ci_pipeline_32chars!
          INTERNAL_API_SECRET: test_internal_api_secret_for_ci_pipeline_32chars!
          NODE_ENV: test
          GITHUB_ACTIONS: 'true'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd14a369e91ce0b5efd6e0196ac721811e77b6 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff07dd23da81bc5e88612d6a5063 # v2.0.1

      - name: Build & push image
        id: image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - id: td-api
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfcac51b702982d6418247674ee572c84268 # v1.2.0
        with:
          task-definition: deploy/task-def-api.json
          container-name: api
          image: ${{ steps.image.outputs.image }}

      - id: td-worker
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfcac51b702982d6418247674ee572c84268 # v1.2.0
        with:
          task-definition: deploy/task-def-worker.json
          container-name: worker
          image: ${{ steps.image.outputs.image }}

      # Migrations run ONCE as a one-off task, never on container start (avoids N replicas racing).
      - name: Run DB migrations (fleet all tenants)
        run: |
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.td-api.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$TD_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNETS }}],securityGroups=[${{ vars.APP_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/db/migrate-all.js"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Waiting for migration task $TASK_ARN to finish..."
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$CODE" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "Migration task failed with exit code $CODE. Reason: $REASON"
            exit 1
          fi
          echo "Migration task succeeded with exit code 0."

      - uses: aws-actions/amazon-ecs-deploy-task-definition@df4a08a49c370d50426fe35c6280771a48075323 # v2.1.2
        with:
          task-definition: ${{ steps.td-api.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true # rolling deploy; ECS rolls back if health checks fail

      - uses: aws-actions/amazon-ecs-deploy-task-definition@df4a08a49c370d50426fe35c6280771a48075323 # v2.1.2
        with:
          task-definition: ${{ steps.td-worker.outputs.task-definition }}
          service: ${{ env.WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Post-deploy smoke test (/health/live and /health/ready)
        run: |
          if [ -n "$PROD_API_BASE_URL" ]; then
            echo "Verifying API live probe..."
            curl -f --retry 5 --retry-delay 5 --max-time 10 "$PROD_API_BASE_URL/health/live"
            echo "Verifying API ready probe..."
            curl -f --retry 3 --retry-delay 5 --max-time 10 "$PROD_API_BASE_URL/health/ready"
            echo "Smoke test passed successfully."
          else
            echo "PROD_API_BASE_URL not set; skipping remote smoke test."
          fi
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
