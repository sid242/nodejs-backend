worker_processes auto;
events { worker_connections 4096; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=peripconn:10m;

  upstream api {
    least_conn;
    server api:3000;   # docker DNS returns every replica when scaled
    keepalive 64;
  }

  server {
    listen 80;
    client_max_body_size 2m;   # uploads go straight to S3, so keep this small

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /metrics { deny all; }   # scrape Prometheus on the internal network only

    location /socket.io/ {
      limit_conn peripconn 20;
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / {
      limit_req zone=perip burst=60 nodelay;
      proxy_set_header Connection "";
      proxy_pass http://api;
    }
  }
}
